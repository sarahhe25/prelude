services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: interview_rag
    ports:
      - "5432:5432"
    volumes:
      - interview_rag_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d interview_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interview_rag_data:
